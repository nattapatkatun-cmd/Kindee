ext {
    // Health Connect needs API 26+ (and @capgo/capacitor-health declares minSdk 26).
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // @capacitor-firebase/authentication: link the native Google Sign-In SDK. Google blocks
    // OAuth inside an embedded WebView, so the web popup/redirect flow cannot work in the app.
    rgcfaIncludeGoogle = true
    androidxCredentialsVersion = '1.3.0'
    androidxCredentialsPlayServicesAuthVersion = '1.3.0'
}
